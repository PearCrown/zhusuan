<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1540 900" preserveAspectRatio="none">
  <style>
    .river { fill: none; stroke: #527d7d; stroke-linecap: round; stroke-linejoin: round; }
    .main-river { stroke-width: 11; opacity: .57; }
    .river-light { stroke: #e5dab4; stroke-width: 2; opacity: .64; }
    .tributary { stroke-width: 4; opacity: .63; }
    .place, .water-name, .region, .compass { font-family: STSong, SimSun, serif; }
    .place { fill: #493923; font-size: 20px; paint-order: stroke; stroke: #eed4a5; stroke-width: 5px; stroke-linejoin: round; }
    .place circle { fill: #ead2a2; stroke: #624d37; stroke-width: 2.2px; }
    .place text, .region text { transform-box: fill-box; transform-origin: left center; transform: scaleX(.82); }
    .primary { fill: #533823; font-size: 25px; font-weight: 700; }
    .primary circle { fill: #774737; stroke: #eed1a1; stroke-width: 2px; }
    .leader { fill: none; stroke: #705336; stroke-width: 1.3px; opacity: .76; }
    .water-name { fill: #315f5e; font-size: 21px; letter-spacing: .16em; }
    .region { fill: #695537; opacity: .74; font-size: 31px; letter-spacing: .23em; }
    .compass { fill: #674531; font-size: 25px; }
  </style>
  <!-- City anchors and the river skeleton are traced from the source figure. Leader lines offset only the labels. -->
