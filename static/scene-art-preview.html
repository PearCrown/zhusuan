<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>城门场景 · 美术试放</title>
<link rel="stylesheet" href="css/scene-art-preview.css">
<script src="js/scene-host.js" defer></script><script src="js/scene-model.js" defer></script><script src="js/scene-view.js" defer></script><script src="js/scene-art-preview.js" defer></script></head>
<body><main id="art-preview" aria-label="城门单场景美术试放">
<div id="art-stage"><div id="art-canvas" tabindex="0" role="group" aria-label="城门道路，A或D及左右键移动，E交互，Esc结束对话"></div></div>
<header class="preview-hud"><h1>城门旁道路</h1><p>美术试放 / 占位角色</p></header>
<p id="preview-status" class="preview-status" role="status" aria-live="polite">正在载入背景…</p>
<p id="preview-target" class="preview-target" role="status" aria-live="polite"></p>
<p class="preview-help">A D / ← → 移动 · E 交互 · Q 切换目标 · Esc 结束对话</p>
<section id="preview-dialogue" hidden role="dialog" aria-modal="true" aria-labelledby="preview-speaker"><div><h2 id="preview-speaker">守门人</h2><p id="preview-dialogue-text"></p></div><button id="preview-close" type="button">结束对话 <kbd>Esc</kbd></button><p class="dialogue-help">Enter / Space / Esc 返回场景</p></section>
<noscript><p>请启用JavaScript体验场景。</p></noscript>
</main></body></html>
